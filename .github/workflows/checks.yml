name: Compatibility checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install syntax-check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq lua5.4
      - name: Shell and Lua syntax
        run: |
          bash -n bin/glass bin/glass-engine
          luac -p glass.lua
      - name: Manifest JSON
        run: python3 -m json.tool manifest.json > /dev/null
      - name: Hermetic bar lifecycle tests
        run: python3 -m unittest discover -s tests -v
      - name: Whitespace checks
        run: git show --format= --check HEAD
